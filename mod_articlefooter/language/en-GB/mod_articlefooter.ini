MOD_ARTICLEFOOTER="Article Footer (custom HTML)"
MOD_ARTICLEFOOTER_XML_DESCRIPTION="Outputs custom HTML below articles from selected categories. Assign it to a template position placed after the component (e.g. main-bottom) on all pages."
MOD_ARTICLEFOOTER_CATEGORIES="Categories"
MOD_ARTICLEFOOTER_CATEGORIES_DESC="The module is shown only in articles from these categories."
MOD_ARTICLEFOOTER_SUBCATEGORIES="Include subcategories"
MOD_ARTICLEFOOTER_SUBCATEGORIES_DESC="If enabled, articles from child categories of the selected ones are included too."
MOD_ARTICLEFOOTER_EXCL_CATEGORIES="Excluded categories"
MOD_ARTICLEFOOTER_EXCL_CATEGORIES_DESC="Articles from these categories and all their subcategories never show the module, even if the category is selected above."
MOD_ARTICLEFOOTER_EXCL_ARTICLES="Excluded articles (IDs)"
MOD_ARTICLEFOOTER_EXCL_ARTICLES_DESC="Comma-separated article IDs where the module is never shown."
MOD_ARTICLEFOOTER_HTML="HTML code"
MOD_ARTICLEFOOTER_HTML_DESC="Any HTML, CSS or JavaScript, output as is. Placeholders: {forum_url} (value of the custom field below; the module is hidden if it is empty), {article_title}, {article_id}."
MOD_ARTICLEFOOTER_PREPARE="Process content plugins"
MOD_ARTICLEFOOTER_PREPARE_DESC="Run the code through content plugins (e.g. {loadmodule}, {emailcloak})."
MOD_ARTICLEFOOTER_FIELD="Custom field with forum topic URL"
MOD_ARTICLEFOOTER_FIELD_DESC="Article custom field (Content > Fields) whose value replaces {forum_url}. Use a URL or Text field. Where it is empty, the module is not shown."
MOD_ARTICLEFOOTER_FIELD_SELECT="- Select field -"
